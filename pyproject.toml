[project]
name = "container-freight-forecasting"
version = "0.1.0"
description = "Weekly forecasts of container spot freight rates on Asia trade lanes, built from public data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pandera>=0.35.0",
    "pypdf>=6.21.3",
    "python-calamine>=0.9.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

# The shared helpers live in src/hff/. The package name differs from the
# project name, so it is set explicitly.
[tool.uv.build-backend]
module-name = "hff"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/W: style errors and warnings, F: likely bugs (unused or undefined
# names), I: import order.
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
